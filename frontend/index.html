<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tasks, assignments, and shopping lists in one place." />
    <!-- Google Search Console's "HTML tag" verification method (not DNS -
         checklist-kmtw.onrender.com's DNS zone belongs to Render, not this
         project, so there's no TXT record to add there). Proves the same
         ownership Search Console needs before it'll let this site's URL be
         submitted for crawling/indexing. -->
    <meta name="google-site-verification" content="09jWJShjJqBHxOjRKahMUSS7yCS9ASAs1lMPSbq76J8" />
    <link rel="canonical" href="https://checklist-kmtw.onrender.com/" />
    <!-- What Google (and a link unfurled in Slack/iMessage/etc.) actually
         reads to decide the title/snippet/preview shown for this page -
         separate from the description meta tag above, which some crawlers
         ignore in favor of these. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Checklist" />
    <meta property="og:description" content="Tasks, assignments, and shopping lists in one place." />
    <meta property="og:url" content="https://checklist-kmtw.onrender.com/" />
    <meta property="og:image" content="https://checklist-kmtw.onrender.com/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Checklist" />
    <meta name="twitter:description" content="Tasks, assignments, and shopping lists in one place." />
    <meta name="twitter:image" content="https://checklist-kmtw.onrender.com/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <!-- iOS ignores the manifest above for "Add to Home Screen" - these are
         its own equivalents: apple-touch-icon for the home-screen icon,
         apple-mobile-web-app-capable to open without Safari's own chrome
         (address bar/tab strip) once launched from that icon. -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Checklist" />
    <title>Checklist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
