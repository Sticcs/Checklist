services:
  - type: web
    name: checklist
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set to a Postgres connection string from Neon or Supabase's free tier
      # (Render's own free-tier Postgres expires after 90 days; those don't).
      # Filled in from the Render dashboard, not stored in this file.
      - key: DATABASE_URL
        sync: false
      # "Sign in with Google" (backend/app/routers/auth.py) - from a Google
      # Cloud project's OAuth 2.0 Client ID (type "Web application"), with
      # PUBLIC_BASE_URL + "/api/auth/google/callback" added as an authorized
      # redirect URI. Google sign-in is simply unavailable (the login route
      # 503s) until these are filled in - not required for the rest of the
      # app to work.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://checklist-kmtw.onrender.com
